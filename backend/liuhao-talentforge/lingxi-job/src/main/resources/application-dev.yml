# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/lingxi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
#    password: 123456

# 文件存储配置
storage:
  type: minio
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: quanxiaoha
    secret-key: quanxiaoha
    bucket-name: hrms
  aliyun-oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    access-key: your-oss-access-key-id
    secret-key: your-oss-access-key-secret
    bucket-name: lingxi-h

# 阿里云短信配置
aliyun:
  accessKeyId: your-sms-access-key-id
  accessKeySecret: your-sms-access-key-secret
  sms:
    mock: true
    sign-name: 速通互联验证码
    template-code: 100001

logging:
  level:
    com.lingxi.${f#lingxi-}: DEBUG

# AI Agent 配置（开发环境：固定 Real 百宝箱，密钥仅来自 ${BAIBAOXIANG_*} 环境变量，严禁硬编码）
ai:
  agent:
    mock: false

# 内部服务凭证（开发环境）
service-auth:
  tokens:
    lingxi-user: user-token-dev
    lingxi-resume: resume-token-dev
    lingxi-hr: hr-token-dev
    lingxi-admin: admin-token-dev
    lingxi-job: job-token-dev

# 百宝箱配置（开发环境：真实凭证，真实 AI 联调用；敏感信息，谨慎处理 git 提交）
baibaoxiang:
  authorization: your-baibaoxiang-authorization
  user-id-hmac-key: your-baibaoxiang-hmac-key
  jd-parse-app-id: your-jd-parse-app-id
  interview-app-id: your-interview-app-id
