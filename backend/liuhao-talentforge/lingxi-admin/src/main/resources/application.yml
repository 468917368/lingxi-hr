server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lingxi}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASS:123456}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.lingxi.admin.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  sentinel:
    enabled: true

# 服务间认证配置（配合 lingxi-common FeignConfig.serviceAuthInterceptor）
service-auth:
  caller: lingxi-admin
  token: ${LINGXI_ADMIN_SERVICE_TOKEN:admin-token-dev}

# Sentinel日志目录
sentinel:
  log:
    dir: ./logs/csp
