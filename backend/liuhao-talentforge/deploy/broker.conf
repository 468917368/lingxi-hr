# RocketMQ Broker 配置（部署时手动把 <B_IP> 替换为 8G 机的内网 IP）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# 必须填 8G 机内网 IP（setup-app.sh 会自动替换 <B_IP>），否则生产者/消费者无法跨主机连接 broker
brokerIP1=<B_IP>
# NameServer 在本机 mynet 里，用容器名互通
namesrvAddr=rocketmq-namesrv:9876
listenPort=10911

deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 自动创建 Topic（interview-event 等），避免预建
autoCreateTopicEnable=true

storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
