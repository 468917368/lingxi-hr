# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/lingxi?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456

# 文件存储配置（对齐 lingxi-hr：开发环境用真实阿里云OSS 广州 lingxi-h；MinioUtil 按 storage.type 选择 minio/aliyun-oss/本地）
storage:
  type: aliyun-oss
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: quanxiaoha
    secret-key: quanxiaoha
    bucket-name: hrms
  aliyun-oss:
    endpoint: oss-cn-guangzhou.aliyuncs.com
    access-key-id: your-oss-access-key-id
    access-key-secret: your-oss-access-key-secret
    bucket-name: lingxi-h

# 阿里云短信配置
aliyun:
  sms:
    mock: true                                     # true=模拟短信+验证码返回前端，false=真实发送
    sign-name: 速通互联验证码
    template-code: 100001
    access-key-id: your-sms-access-key-id
    access-key-secret: your-sms-access-key-secret
    endpoint: dysmsapi.aliyuncs.com

logging:
  level:
    com.lingxi.${f#lingxi-}: DEBUG
